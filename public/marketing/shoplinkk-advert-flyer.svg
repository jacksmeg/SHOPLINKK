    <text x="36" y="158" fill="#061A3A" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900">JACK STUDIOS</text>
    <text x="36" y="196" fill="#465267" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">0549896901</text>
    <text x="36" y="229" fill="#465267" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Dunkwa-on-Offin, Central Region, Ghana</text>
