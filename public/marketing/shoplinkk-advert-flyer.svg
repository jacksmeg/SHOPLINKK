    <text x="112" y="39" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">ShopLinkk</text>
    <text x="112" y="72" fill="#D9E8FF" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Dunkwa-on-Offin marketplace</text>
  </g>

  <g transform="translate(98 258)">
