services:
  - type: web
    name: shoplinkk-web
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    preDeployCommand: npm run db:deploy
    startCommand: npm run start
    healthCheckPath: /api/health
    domains:
      - www.shoplinkk.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shoplinkk-postgres
          property: connectionString
      - key: NEXTAUTH_URL
        value: https://www.shoplinkk.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://www.shoplinkk.com
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: INTEGRATION_ENCRYPTION_KEY
        generateValue: true
      - key: SHOPLINKK_ADMIN_EMAIL
        sync: false
      - key: SHOPLINKK_ADMIN_PASSWORD
        sync: false

databases:
  - name: shoplinkk-postgres
    plan: basic-256mb
    region: frankfurt
