  <g transform="translate(674 886)" filter="url(#shadow)">
    <rect x="0" y="0" width="284" height="284" rx="30" fill="#FFFFFF"/>
    <image href="shoplinkk-qr.png" x="24" y="24" width="236" height="236" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <text x="540" y="1248" text-anchor="middle" fill="#061A3A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900">Shop local. Sell more. Grow together.</text>
  <text x="540" y="1288" text-anchor="middle" fill="#061A3A" opacity="0.78" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">A local commerce platform starting from Dunkwa-on-Offin.</text>
</svg>
