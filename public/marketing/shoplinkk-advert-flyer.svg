      <text x="0" y="112" fill="#061A3A" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900">Earn by delivery</text>
      <text x="0" y="150" fill="#465267" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Register, verify, accept</text>
      <text x="0" y="178" fill="#465267" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">deliveries and track jobs.</text>
    </g>
