      <stop offset="0" stop-color="#0B2F66"/>
      <stop offset="0.55" stop-color="#061A3A"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#061A3A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="#FFFFFF"/>
  <rect x="54" y="54" width="972" height="1242" rx="42" fill="url(#shine)"/>
  <path d="M54 872C249 786 386 828 557 914C718 996 855 1012 1026 931V1296H54V872Z" fill="#EF233C"/>
  <path d="M54 1002C213 940 400 962 563 1035C752 1118 879 1121 1026 1058V1296H54V1002Z" fill="#0891B2"/>
  <path d="M54 1126C245 1074 422 1129 570 1182C742 1244 887 1248 1026 1211V1296H54V1126Z" fill="#FACC15"/>

  <circle cx="948" cy="166" r="54" fill="#EF233C"/>
  <circle cx="891" cy="218" r="24" fill="#FACC15"/>
  <circle cx="154" cy="1137" r="66" fill="#FFFFFF" opacity="0.14"/>
  <circle cx="922" cy="1095" r="86" fill="#FFFFFF" opacity="0.12"/>

  <g transform="translate(98 96)">
