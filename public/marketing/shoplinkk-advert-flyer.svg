    <text x="0" y="86" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="900" letter-spacing="-1">Sell faster.</text>
    <text x="0" y="166" fill="#FACC15" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900">Order food. Find services.</text>
    <text x="0" y="226" fill="#D9E8FF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Products, food, riders, stores, jobs, events,</text>
    <text x="0" y="263" fill="#D9E8FF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">property, vehicles and trusted local services.</text>
  </g>

