      <text x="0" y="150" fill="#465267" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Post products, services,</text>
      <text x="0" y="178" fill="#465267" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">food menus and adverts.</text>
    </g>
    <g transform="translate(722 612)">
